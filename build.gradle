plugins {
    id 'fabric-loom' version '1.17.12'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven { name = "Fabric"; url = "https://maven.fabricmc.net/" }
    maven { name = "Sponge Snapshots"; url = "https://repo.spongepowered.org/repository/maven-public/" }
}

loom {
    noIntermediateMappings()
    runs {
        client {
            property "fabric.runtimeMappingNamespace", "named"
        }
    }
}

def generatedMappings = file("${layout.buildDirectory.get().asFile}/generated/mappings/empty-mappings.jar")
if (!generatedMappings.exists()) {
    generatedMappings.parentFile.mkdirs()
    new java.util.zip.ZipOutputStream(new FileOutputStream(generatedMappings)).withCloseable { zip ->
        zip.putNextEntry(new java.util.zip.ZipEntry("mappings/mappings.tiny"))
        zip.write("tiny\t2\t0\tofficial\tnamed\tintermediary\n".getBytes(java.nio.charset.StandardCharsets.UTF_8))
        zip.closeEntry()
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings files(generatedMappings)
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    implementation files('src/main/resources/META-INF/jars/baritone-fabric-1.15.0-10-g57758940+mc26.2-blade1.jar')

    compileOnly 'org.jetbrains:annotations:26.0.1'
    compileOnly 'org.projectlombok:lombok:1.18.36'
    compileOnly 'com.google.errorprone:error_prone_annotations:2.36.0'
    compileOnly 'biz.aQute.bnd:biz.aQute.bnd.annotation:7.1.0'

    // JNA для native-guard
    implementation 'net.java.dev.jna:jna:5.14.0'
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"
    // Исключаем cpp-исходники из финального jar
    exclude 'cpp/**'
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.encoding = "UTF-8"
    it.options.compilerArgs += ['-proc:none']
    exclude 'module-info.java'
    exclude '**/package-info.java'
}

java {
    // Без sources-jar в релизе — исходники не должны попадать в распространяемый файл
    sourceCompatibility = JavaVersion.toVersion(25)
    targetCompatibility = JavaVersion.toVersion(25)
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}"}
    }
    // Явно добавляем native DLL в jar — Fabric Loom по умолчанию excludes .dll из ресурсов
    from('src/main/resources') {
        include 'win32-x86-64/attackdlc-guard.dll'
        include 'win32-x86/attackdlc-guard.dll'
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    }
}

// ─── Протект: генерация хешей классов для integrity check ─────────────────

task dumpClassHashes {
    group = 'protect'
    description = 'Выводит SHA-256 хеши ключевых классов — вставить в NativeGuard.java'
    doLast {
        // Fabric Loom кладёт jar в devlibs, не в libs
        def jarFile = file("${layout.buildDirectory.get().asFile}/devlibs/${project.base.archivesName.get()}-${project.version}-dev.jar")
        if (!jarFile.exists()) jarFile = jar.archiveFile.get().asFile
        def zip = new java.util.zip.ZipFile(jarFile)
        def entries = [
            'org/attackdlc/license/LicenseManager.class',
            'org/attackdlc/license/Hwid.class',
            'org/attackdlc/AttackDlcClient.class'
        ]
        entries.each { path ->
            def e = zip.getEntry(path)
            if (!e) { println "[MISSING] $path"; return }
            def md = java.security.MessageDigest.getInstance('SHA-256')
            zip.getInputStream(e).withCloseable { is ->
                byte[] b = new byte[8192]
                int n
                while ((n = is.read(b)) != -1) md.update(b, 0, n)
            }
            def hex = md.digest().collect { String.format('%02x', it) }.join()
            println "$path"
            println "  → $hex"
            println ""
        }
        zip.close()
    }
}

// ─── Обфускация через OBF (ASM-based, Java 25 compatible) ─────────────────
// Запуск: .\gradlew.bat obfuscate
// После обфускации копирует результат в devlibs/ для деплоя.

tasks.register('obfuscate', Exec) {
    group = 'protect'
    description = 'Обфускация клиента через OBF: ASM-переименование + XOR-строки + junk-классы'
    dependsOn jar

    def inputJar  = jar.archiveFile.get().asFile
    def obfOutDir = file("${layout.buildDirectory.get().asFile}/obf")
    obfOutDir.mkdirs()
    def outputJar = file("${obfOutDir}/${project.base.archivesName.get()}-${project.version}-obf.jar")
    def mappings  = file("${obfOutDir}/mappings.txt")
    def obfJar    = file("C:/Users/Kitikat/Desktop/OBF/target/fabric-obfuscator.jar")

    if (!obfJar.exists()) {
        throw new GradleException("OBF не найден: ${obfJar}. Собери в IntelliJ: Maven → package")
    }

    workingDir project.rootDir
    commandLine 'java', '-jar', obfJar.absolutePath,
            inputJar.absolutePath,
            outputJar.absolutePath,
            '--mappings', mappings.absolutePath,
            '--junk-ratio', '9',
            '--keep-class', 'sdk/api/invoke/api/invoke',
            '--keep-class', 'sdk/api/invoke/impl/PackerMode',
            '--keep-class', 'sdk/api/invoke/impl/PackerType'

    doLast {
        if (!outputJar.exists()) throw new GradleException("OBF не создал jar: ${outputJar}")
        // Результат кладём в devlibs — оттуда лаунчер берёт для запуска
        def devlibs = file("${layout.buildDirectory.get().asFile}/devlibs")
        devlibs.mkdirs()
        def devJar = file("${devlibs}/${project.base.archivesName.get()}-${project.version}-dev.jar")
        outputJar.renameTo(devJar)
        println "[obf] → ${devJar}"
    }
}

// ─── Release-jar: обфусцированный клиент для магазина ──────────────────────

task releaseJar(type: Copy) {
    dependsOn obfuscate
    group = 'distribution'
    description = 'Копирует obfuscated jar в store + release'
    doLast {
        def devlibs  = file("${layout.buildDirectory.get().asFile}/devlibs")
        def devJar   = file("${devlibs}/${project.base.archivesName.get()}-${project.version}-dev.jar")
        def release  = file("${layout.buildDirectory.get().asFile}/release")
        release.mkdirs()
        if (devJar.exists()) {
            copy { from devJar; into release; rename { "attackdlc.jar" } }
            println "[release] → ${release}/attackdlc.jar"
        }
    }
}

// ─── Хеши классов после обфускации (обновлять NativeGuard при каждой сборке) ─

task dumpClassHashesAfterObf {
    group = 'protect'
    description = 'Выводит SHA-256 хешей обфусцированных классов — вставить в NativeGuard.java'
    dependsOn obfuscate
    doLast {
        def devlibs = file("${layout.buildDirectory.get().asFile}/devlibs")
        def devJar  = file("${devlibs}/${project.base.archivesName.get()}-${project.version}-dev.jar")
        if (!devJar.exists()) { println "[hashes] dev jar not found"; return }
        def zip = new java.util.zip.ZipFile(devJar)
        def targets = ['LicenseManager.class', 'Hwid.class', 'AttackDlcClient.class']
        targets.each { name ->
            def e = zip.entries().find { it.name.endsWith("/$name") || it.name == name }
            if (!e) { println "[MISSING] $name"; return }
            def md = java.security.MessageDigest.getInstance('SHA-256')
            zip.getInputStream(e).withCloseable { is ->
                byte[] b = new byte[8192]; int n
                while ((n = is.read(b)) != -1) md.update(b, 0, n)
            }
            def hex = md.digest().collect { String.format('%02x', it) }.join()
            println "$name  →  $hex"
        }
        zip.close()
    }
}
